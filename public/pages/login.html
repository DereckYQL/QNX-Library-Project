</head>
<body>

<header>
  <a class="brand" href="../index.html">
    <div class="brand-logo">
      <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg"><path d="M60 14 A46 46 0 1 0 92 92 L102 108 L86 101 L74 90 A46 46 0 0 0 60 14 Z M60 26 A34 34 0 1 1 66 80 A34 34 0 0 1 60 26 Z" fill="#0B1C2B"/><g transform="translate(30 52)"><path d="M5 8 L27 2.5 L27 28.5 L5 33.2 Z" fill="#C9A86A"/><path d="M33 2.5 L55 8 L55 33.2 L33 28.5 Z" fill="#fff"/></g><path d="M68 80 L86 86 L84 103 L77 97 L70 103 Z" fill="#C9A86A"/></svg>

  </nav>
</header>

<main class="form-wrap">
  <form id="loginForm" class="form-box">
    <h2>Iniciar Sesión</h2>
    <p class="sub">Accede con tu cuenta QNX — JWT + bcrypt</p>
    <div class="alert" id="loginAlert"></div>
    <label for="email">Email</label>
    <input type="email" id="email" required placeholder="tu@email.com" autocomplete="email">
    <label for="password">Contraseña</label>
    <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password">
    <button type="submit">Entrar</button>
    <p class="form-foot">¿No tienes cuenta? <a href="registro.html">Regístrate</a></p>
    <p style="text-align:center;margin-top:0.6rem;font-size:0.75rem;color:var(--muted)">30 intentos de autenticacion / 15 min</p>
  </form>
</main>

<footer><p><strong>QNX Library</strong> v3.0 · Login funcional</p></footer>
<script src="../js/runtime-config.js"></script>
<script src="../js/db.js"></script>
