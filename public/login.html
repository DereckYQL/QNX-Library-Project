<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión — QNX Library</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&family=Roboto+Slab:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <div class="nav-brand">📚 QNX Library</div>
        <ul class="nav-links">
            <li><a href="index.html" class="nav-item">Inicio</a></li>
            <li><a href="catalogo.html" class="nav-item">Catálogo</a></li>
            <li><a href="registro.html" class="nav-item">Registrar Libro</a></li>
            <li><a href="login.html" class="nav-item active">Iniciar Sesión</a></li>
        </ul>
    </nav>

    <section class="page active">
        <div class="page-banner">
            <img src="https://images.unsplash.com/photo-1481627834876-b7833e8f5570?w=1200&q=80" alt="Iniciar sesión" class="page-banner-img">
            <div class="page-banner-overlay">
                <h2>Iniciar Sesión</h2>
                <p>Accede a tu cuenta para gestionar tu biblioteca.</p>
            </div>
        </div>
        <div class="section-content">
            <div class="form-container">
                <form onsubmit="iniciarSesion(event)">
                    <div class="form-group">
                        <label for="email">Correo electrónico</label>
                        <input type="email" id="email" placeholder="correo@ejemplo.com" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn-submit">Entrar</button>
                </form>
                <div id="login-msg" class="form-msg"></div>
            </div>
        </div>
    </section>

    <footer>
        <p>© 2026 QNX Library</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
