<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar Sesion - Biblioteca Virtual</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <header>
    <h1>Biblioteca Virtual</h1>
  </header>

  <nav>
    <a href="index.html">Inicio</a>
    <a href="login.html" class="activo">Iniciar Sesion</a>
    <a href="registro.html">Registrar Libro</a>
    <a href="catalogo.html">Catalogo</a>
  </nav>

  <main>
    <section style="max-width:380px; margin:40px auto;">
      <h2>Iniciar Sesion</h2>
      <form id="form-login">
        <label for="email">Correo electronico</label>
        <input type="email" id="email" placeholder="correo@ejemplo.com" required>

        <label for="password">Contrasena</label>
        <input type="password" id="password" placeholder="••••••••" required>

        <div id="mensaje-login"></div>

        <button type="submit">Entrar</button>
      </form>
    </section>
  </main>

  <footer>
    <p>Proyecto Biblioteca &mdash; 4&deg; Medio</p>
  </footer>

  <script src="js/login.js"></script>
</body>
</html>
