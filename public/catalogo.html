</head>
<body>

<header>
  <a class="brand" href="index.html">
    <div class="brand-logo">
      <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg"><path d="M60 14 A46 46 0 1 0 92 92 L102 108 L86 101 L74 90 A46 46 0 0 0 60 14 Z M60 26 A34 34 0 1 1 66 80 A34 34 0 0 1 60 26 Z" fill="#0B1C2B"/><g transform="translate(30 52)"><path d="M5 8 L27 2.5 L27 28.5 L5 33.2 Z" fill="#C9A86A"/><path d="M33 2.5 L55 8 L55 33.2 L33 28.5 Z" fill="#fff"/></g><path d="M68 80 L86 86 L84 103 L77 97 L70 103 Z" fill="#C9A86A"/></svg>

  <nav>
    <a href="index.html">Inicio</a>

  </nav>
</header>

<main class="container">
  <section>
    <div class="section-head">
      <h2>Catálogo de <em>libros</em></h2>
      <p>Tabla simple con cabecera navy y borde dorado</p>
    </div>

    <div class="searchbar" style="margin-bottom:1rem;max-width:none">
      <input type="search" id="filtroCatalogo" placeholder="Filtrar por título, autor o género...">
      <button type="button" onclick="document.getElementById('filtroCatalogo').value='';document.getElementById('filtroCatalogo').dispatchEvent(new Event('input'))">Limpiar</button>
    </div>

    <div class="table-wrap">
      <table id="tablaLibros">
        <thead><tr><th>ID</th><th>Título</th><th>Autor</th><th>Género</th><th>Año</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>
</main>

<footer><p><strong>QNX Library</strong> v2.3 · Catálogo — 24 libros</p></footer>
<script src="js/script.js"></script>
