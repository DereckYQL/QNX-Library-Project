<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo — QNX Library</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&family=Roboto+Slab:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <div class="nav-brand">📚 QNX Library</div>
        <ul class="nav-links">
            <li><a href="index.html" class="nav-item">Inicio</a></li>
            <li><a href="catalogo.html" class="nav-item active">Catálogo</a></li>
            <li><a href="registro.html" class="nav-item">Registrar Libro</a></li>
            <li><a href="login.html" class="nav-item">Iniciar Sesión</a></li>
        </ul>
    </nav>

    <section class="page active">
        <div class="page-banner">
            <img src="https://images.unsplash.com/photo-1524995997946-a1c2e315a42f?w=1200&q=80" alt="Catálogo" class="page-banner-img">
            <div class="page-banner-overlay">
                <h2>Catálogo de Libros</h2>
                <p>Encuentra tu próxima lectura entre nuestra colección.</p>
            </div>
        </div>
        <div class="section-content">
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Buscar por título o autor...">
                <button onclick="buscarLibro()">Buscar</button>
            </div>
            <div class="books" id="lista-libros">
                <p class="loading">Cargando libros...</p>
            </div>
        </div>
    </section>

    <footer>
        <p>© 2026 QNX Library</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
