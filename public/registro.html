<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registrar Libro - Biblioteca Virtual</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <header>
    <h1>Biblioteca Virtual</h1>
  </header>

  <nav>
    <a href="index.html">Inicio</a>
    <a href="login.html">Iniciar Sesion</a>
    <a href="registro.html" class="activo">Registrar Libro</a>
    <a href="catalogo.html">Catalogo</a>
  </nav>

  <main>
    <section>
      <h2>Registrar Libro</h2>
      <form id="form-libro">
        <label for="titulo">Titulo *</label>
        <input type="text" id="titulo" placeholder="Ej: Cien Anos de Soledad" required>

        <label for="autor">Autor *</label>
        <input type="text" id="autor" placeholder="Ej: Gabriel Garcia Marquez" required>

        <label for="genero">Genero</label>
        <input type="text" id="genero" placeholder="Ej: Novela">

        <div id="mensaje-form"></div>

        <button type="submit">Guardar Libro</button>
      </form>
    </section>
  </main>

  <footer>
    <p>Proyecto Biblioteca &mdash; 4&deg; Medio</p>
  </footer>

  <script src="js/registro.js"></script>
</body>
</html>
