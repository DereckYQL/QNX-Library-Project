<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QNX Library - Registro v2.4</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <a class="brand" href="index.html">
    <div class="brand-logo">
      <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg"><path d="M60 14 A46 46 0 1 0 92 92 L102 108 L86 101 L74 90 A46 46 0 0 0 60 14 Z M60 26 A34 34 0 1 1 66 80 A34 34 0 0 1 60 26 Z" fill="#0B1C2B"/><g transform="translate(30 52)"><path d="M5 8 L27 2.5 L27 28.5 L5 33.2 Z" fill="#C9A86A"/><path d="M33 2.5 L55 8 L55 33.2 L33 28.5 Z" fill="#fff"/></g><path d="M68 80 L86 86 L84 103 L77 97 L70 103 Z" fill="#C9A86A"/></svg>
    </div>
    <span><strong>QNX Library</strong><small>Registro</small></span>
  </a>
  <nav>
    <a href="index.html">Inicio</a>
    <a href="catalogo.html">Catálogo</a>
    <a href="login.html">Login</a>
    <a href="registro.html" class="active">Registro</a>
  </nav>
</header>

<main class="form-wrap">
  <form id="registroForm" class="form-box">
    <h2>Crear Cuenta</h2>
    <p class="sub">Únete a QNX Library — validación + hashing</p>
    <div class="alert" id="regAlert"></div>
    <label for="nombre">Nombre</label>
    <input type="text" id="nombre" required placeholder="Tu nombre" minlength="2" autocomplete="name">
    <label for="email">Email</label>
    <input type="email" id="email" required placeholder="tu@email.com" autocomplete="email">
    <label for="password">Contraseña</label>
    <input type="password" id="password" required placeholder="Mín. 6 caracteres" minlength="6" autocomplete="new-password">
    <button type="submit">Registrarse</button>
    <p class="form-foot">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
  </form>
</main>

<footer><p><strong>QNX Library</strong> v2.4 · Registro funcional con JWT</p></footer>
<script src="js/script.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
