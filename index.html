<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QNX Library</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>📚 QNX Library</h1>
        <p>Tu biblioteca virtual</p>
    </header>

    <main>
        <section class="search">
            <input type="text" id="searchInput" placeholder="Buscar libro...">
            <button onclick="buscarLibro()">Buscar</button>
        </section>

        <section class="books">
            <div class="book">
                <h3>Don Quijote de la Mancha</h3>
                <p>Miguel de Cervantes</p>
                <button>Leer</button>
            </div>

            <div class="book">
                <h3>Cien años de soledad</h3>
                <p>Gabriel García Márquez</p>
                <button>Leer</button>
            </div>

            <div class="book">
                <h3>La Odisea</h3>
                <p>Homero</p>
                <button>Leer</button>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2026 QNX Library</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
