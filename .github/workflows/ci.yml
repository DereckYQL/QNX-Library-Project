name: Security and runtime checks
on:
  push:
  pull_request:
  schedule:
    - cron: '19 8 * * 1'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check:runtime
      - run: npm run schema:check
      - run: npm test
      - run: npm audit --audit-level=moderate
      - name: Install and verify Gitleaks
        env:
          VERSION: 8.30.1
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          curl --fail --silent --show-error --location --retry 3 "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o "gitleaks_${VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_checksums.txt" -o checksums.txt
          sha256sum --check --ignore-missing checksums.txt
          tar -xzf "gitleaks_${VERSION}_linux_x64.tar.gz" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      - run: npm run scan:secrets
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Find compatible Chrome and ChromeDriver
        run: |
          echo "CHROMIUM=$(command -v google-chrome)" >> "$GITHUB_ENV"
          echo "CHROMEDRIVER=$(command -v chromedriver)" >> "$GITHUB_ENV"
          google-chrome --version
          chromedriver --version
      - run: npm run test:browser
